name: verify-booknest

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify-booknest:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Verify architecture, standards, tests, and platform builds
        run: ./gradlew verifyBookNest --stacktrace
      - name: Run adaptive Android UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: >-
            ./gradlew
            :feature:home:presentation:androidConnectedCheck
            :feature:library:presentation:androidConnectedCheck
            :shared:androidConnectedCheck
            --stacktrace
      - name: Build iOS simulator application
        run: >-
          xcodebuild
          -project iosApp/iosApp.xcodeproj
          -scheme iosApp
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
