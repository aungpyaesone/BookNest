config:
  validation: true
  warningsAsErrors: false

build:
  maxIssues: 0

naming:
  active: true
  BooleanPropertyNaming:
    active: true
    allowedPattern: '^(is|has|are|can|should|was|were|will|must|did|does|contains|supports)[A-Z][A-Za-z0-9]*'
  ClassNaming:
    active: true
    classPattern: '[A-Z][A-Za-z0-9]*'
  FunctionNaming:
    active: true
    functionPattern: '([a-z][A-Za-z0-9]*)|(`.*`)'
    excludeClassPattern: '$^'
    ignoreAnnotated: ['Composable']
  PackageNaming:
    active: true
    packagePattern: '^[a-z]+(\.[a-z][a-z0-9]*)*$'
  TopLevelPropertyNaming:
    active: true
    constantPattern: '[A-Z][_A-Z0-9]*'
    propertyPattern: '[a-z][A-Za-z0-9]*'

style:
  active: true
  MagicNumber:
    active: false
  MaxLineLength:
    active: false
  ReturnCount:
    active: true
    max: 3
  UnusedPrivateMember:
    active: true
    ignoreAnnotated: ['Preview']

complexity:
  active: true
  LongMethod:
    threshold: 80
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 10
